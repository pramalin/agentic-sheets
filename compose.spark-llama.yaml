services:
  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAI_API_KEY: local-dgx-spark
      # DGX Spark comparison round (see docs/local-llm-enhancements.md's
      # own section for the full account): the real, confirmed-working
      # vLLM deployment on spark-0c7e listens on port 8000 (vLLM's own
      # default), not 30000 -- verified directly against a real curl
      # call, and against the real, full exception stack trace from a
      # live failed request (java.net.ConnectException: Failed to
      # connect to host.docker.internal/172.17.0.1:30000 -- Connection
      # refused), not assumed. An earlier attempt at this exact fix was
      # made directly in a sandbox session and never actually delivered
      # or committed, causing a long, confusing troubleshooting
      # detour -- this time verified end-to-end: packaged, applied to
      # the real working copy, and confirmed against a real request
      # before considering it done. Overridable via
      # AGENTIC_SHEETS_LOCAL_MODEL_PORT for a different deployment.
      SPRING_AI_OPENAI_BASE_URL: >-
        http://host.docker.internal:${AGENTIC_SHEETS_LOCAL_MODEL_PORT:-8000}/v1
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: >-
        ${AGENTIC_SHEETS_LOCAL_MODEL:-qwen2.5:3B-Q4_K_M}
      SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE: "0.0"
      # A real, concrete risk confirmed directly against the actual
      # DGX deployment before this was added, not a hypothetical: a
      # reasoning-capable model (Qwen3.5-122B-A10B, tested here) can
      # spend its entire token budget on its own visible chain-of-
      # thought (the response's own "reasoning" field) and never reach
      # the actual "content" field this project's structured-output
      # parsing depends on -- confirmed live, a 200-token budget on a
      # simple three-sentence question returned content: null,
      # finish_reason: "length", with 200 tokens of reasoning and no
      # answer at all. Nothing in this project configured any
      # max_tokens before this, anywhere, relying entirely on whatever
      # default the model server itself applies -- genuinely unknown,
      # and not a safe assumption to leave in place for a reasoning
      # model specifically. Generous, not unlimited: reasoning tokens
      # for a real, multi-field mapping task (10+ canonical fields, sum
      # types, notProvidedFields) are likely to need substantially more
      # than a simple one-line question did. Override via
      # AGENTIC_SHEETS_LOCAL_MODEL_MAX_TOKENS if this still isn't
      # enough for a real run, or if a smaller, non-reasoning model
      # doesn't need this much.
      SPRING_AI_OPENAI_CHAT_OPTIONS_MAX_TOKENS: >-
        ${AGENTIC_SHEETS_LOCAL_MODEL_MAX_TOKENS:-16000}
      SPRING_AI_OPENAI_TIMEOUT: "PT5M"
      SPRING_AI_OPENAI_MAX_RETRIES: "0"
      SPRING_AI_RETRY_MAX_ATTEMPTS: "1"
      LOGGING_LEVEL_COM_ALAI_AGENTICSHEETS_MAPPING: DEBUG
