name: ci

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Learned the hard way on sheets-reader-mcp: Maven running directly
      # on the runner (not inside a Docker image with a pinned JDK) has no
      # guarantee its default JDK supports --release 21 unless this is
      # explicit.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Backend unit tests
        working-directory: backend
        run: mvn -B test

      # ProposalDecisionServiceTransactionalTest (added alongside Step
      # 7.5's transactional fix) uses Testcontainers to spin up a real
      # postgres:16 container as part of this same `mvn test` run -- the
      # comment that used to be here ("no real Postgres, exercised only
      # manually") is no longer accurate. ubuntu-latest runners have
      # Docker available natively, so this should work without any
      # extra CI configuration, but it's a genuinely new requirement:
      # this job now needs Docker reachable to pass, not just a JDK.
