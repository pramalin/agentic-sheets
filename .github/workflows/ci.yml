name: ci

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Learned the hard way on sheets-reader-mcp: Maven running directly
      # on the runner (not inside a Docker image with a pinned JDK) has no
      # guarantee its default JDK supports --release 21 unless this is
      # explicit.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Backend tests
        working-directory: backend
        run: mvn -B test

      # ProposalDecisionServiceTransactionalTest (added alongside Step
      # 7.5's transactional fix) uses Testcontainers to spin up a real
      # postgres:16 container as part of this same `mvn test` run --
      # ubuntu-latest runners have Docker available natively, so this
      # works without any extra CI configuration, but it's a genuine
      # requirement: this job needs Docker reachable to pass, not just a
      # JDK.

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # Step 8.5, Checkpoint A: the black-box golden-path test -- real
  # backend container, real Postgres, real sheets-reader-mcp, llmsim
  # standing in for the one genuinely nondeterministic dependency, real
  # validator and dispatcher, local fake-target. See e2e/README.md for
  # the full design reasoning.
  e2e-golden-path:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    steps:
      - name: Checkout agentic-sheets
        uses: actions/checkout@v4
        with:
          path: agentic-sheets

      # compose.yaml's sheets-mcp service builds from ../sheets-reader-mcp
      # -- the same sibling-directory layout this project's own README
      # documents for local development (Prerequisites section). CI has
      # no pre-existing checkout to reuse, so this recreates that layout
      # explicitly: agentic-sheets/ and sheets-reader-mcp/ end up as
      # siblings under $GITHUB_WORKSPACE, matching what compose.yaml's
      # relative build path expects.
      - name: Checkout sheets-reader-mcp
        uses: actions/checkout@v4
        with:
          repository: pramalin/sheets-reader-mcp
          path: sheets-reader-mcp

      - name: Configure environment
        working-directory: agentic-sheets
        run: cp .env.example .env

      - name: Run golden-path E2E test
        working-directory: agentic-sheets
        run: bash e2e/run-golden-path.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: agentic-sheets/e2e/playwright-report/
          retention-days: 7

      # run-golden-path.sh's own cleanup trap tears the environment down
      # on any exit, including failure -- by the time a step here could
      # run `docker compose logs`, the containers are already gone.
      # compose-logs.txt is captured *inside* that same trap, before
      # teardown, specifically so there's still something to upload.
      - name: Upload Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: agentic-sheets/e2e/compose-logs.txt
          retention-days: 7
