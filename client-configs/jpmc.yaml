client: jpmc
# JPMC's "As Of Date" column arrives as a native Excel date cell, not
# text -- no string parsing needed, so this is effectively unused. Kept
# for completeness/documentation rather than left absent.
dateFormat: yyyy-MM-dd

# Step 9: inbox-scanner routing. modelId/worksheetNames are validated
# against the current canonical-model snapshot at registry reload, not
# here -- this parser has no view of that. worksheetNames is a list,
# matched exactly against sheets-reader-mcp's reported worksheet names;
# the scanner quarantines rather than guessing if zero or more than one
# actually matches.
feeds:
  holdings:
    modelId: Holdings
    worksheetNames:
      - Holdings

# Local LLM phase, Step LLM-3 (see docs/local-llm-enhancements.md):
# durable knowledge about JPMC's own vocabulary, validated against
# Holdings' actual ADT at registry reload. Not yet consulted by anything
# at resolution time -- that's Step LLM-4. fieldAliases are additional
# known names for a canonical field beyond its own name (JPMC's real
# fixture already uses "Currency"/"Asset Class" directly, so these are
# mostly illustrative of a client whose *other* files use different
# column names for the same fields); variantValues are JPMC's confirmed
# real source values for currency/asset_class, taken directly from
# mapping-notes.md's JPMC mapping table.
conventions:
  Holdings:
    fieldAliases:
      currency: [Currency, Ccy]
      asset_class: [Asset Class]
    variantValues:
      currency:
        USD: USD
      asset_class:
        Equity: Equity
        Fixed Income: FixedIncome
