services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-agentic_sheets}
      - POSTGRES_USER=${POSTGRES_USER:-agentic_sheets}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Plain SQL, not a migration framework -- same reasoning as
      # agentic-analytics: a handful of tables this project owns end to
      # end doesn't need migration tooling's overhead yet. Only applied
      # on first container creation (docker-entrypoint-initdb.d semantics
      # -- an existing postgres-data volume won't re-run this).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentic_sheets}"]
      interval: 5s
      timeout: 3s
      retries: 10

  sheets-mcp:
    # Assumes sheets-reader-mcp is checked out as a sibling directory,
    # e.g. ~/sources/agentic-sheets and ~/sources/sheets-reader-mcp --
    # matching how this project has actually been developed so far. If
    # your layout differs, override with a different relative path or
    # point this at a published image instead.
    build: ../sheets-reader-mcp
    environment:
      - SHEETS_READER_WORKSPACE_ROOT=/workspace
    volumes:
      # This project's own sample fixtures double as sheets-reader-mcp's
      # mounted workspace -- Step 5's "prove the connection" check reads
      # the real holdings_jpmc/metlife and rate_reset_pimco files, not
      # synthetic ones.
      - ./sample-input:/workspace:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "${AGENTIC_SHEETS_BACKEND_PORT:-8081}:8081"
    environment:
      - AGENTIC_SHEETS_DB_HOST=postgres
      - AGENTIC_SHEETS_DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-agentic_sheets}
      - POSTGRES_USER=${POSTGRES_USER:-agentic_sheets}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - SHEETS_READER_MCP_URL=http://sheets-mcp:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HOLDINGS_WRITER_API_KEY=${HOLDINGS_WRITER_API_KEY:-}
      - AGENTIC_SHEETS_API_KEY=${AGENTIC_SHEETS_API_KEY:-}
      # Step 9: off by default, same conservative default as Step 8d's
      # AGENTIC_SHEETS_FAKE_TARGET_JOURNAL_ENABLED -- a still-incomplete
      # feature (see InboxScanner's own worksheet-resolution TODO)
      # shouldn't run unattended just because the stack is up. Set to
      # true in .env once ready to actually exercise it.
      - AGENTIC_SHEETS_INBOX_ENABLED=${AGENTIC_SHEETS_INBOX_ENABLED:-false}
      # Local LLM phase, Step LLM-6 (see docs/local-llm-enhancements.md),
      # opt-in raw model response logging -- an external review correction
      # made this default off, but a real gap in that same round meant
      # setting it in .env had no effect at all: this variable was never
      # actually forwarded into the container's environment, only added
      # to application.yml's Spring placeholder. Confirmed missing by
      # reading this file's own environment list, not assumed -- a real
      # benchmark run with AGENTIC_SHEETS_LOG_RAW_MODEL_RESPONSE=true set
      # in .env produced zero raw-response log lines, which is what
      # surfaced this gap.
      - AGENTIC_SHEETS_LOG_RAW_MODEL_RESPONSE=${AGENTIC_SHEETS_LOG_RAW_MODEL_RESPONSE:-false}
    volumes:
      # Mounted, not baked into the image -- configuration here is
      # expected to change often (see mapping-notes.md), and the
      # registry's scheduled reload only means anything if editing a file
      # on the host actually changes what the running container sees.
      - ./canonical-models:/config/canonical-models:ro
      - ./client-configs:/config/client-configs:ro
      # Same directory sheets-mcp treats as its workspace -- Step 6's
      # /internal/mapping/propose needs real file bytes to hash for
      # import_batch dedupe, not just sheets-mcp's parsed view of them.
      # Read-write here (unlike sheets-mcp's own :ro copy above) as of
      # Step 9 -- InboxScanner/InboxArchiver read and move files under
      # this same mount's inbox/ and archive/ subdirectories, which
      # sheets-mcp itself never needs to write to. The existing
      # top-level fixture files (holdings_jpmc_20260115.xlsx and
      # friends) are untouched either way -- nothing in this codebase
      # writes to them, and the scanner only ever looks inside inbox/
      # specifically, never at sample-input/'s own top level.
      - ./sample-input:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      sheets-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
