server:
  # Deliberately different from sheets-reader-mcp's 8080, since Step 5
  # wires this backend to sheets-reader-mcp as an MCP client -- the two
  # will likely run side by side, and picking a distinct port now avoids
  # a collision to fix later.
  port: 8081

spring:
  application:
    name: agentic-sheets-backend
  datasource:
    url: jdbc:postgresql://${AGENTIC_SHEETS_DB_HOST:localhost}:${AGENTIC_SHEETS_DB_PORT:5432}/${POSTGRES_DB:agentic_sheets}
    username: ${POSTGRES_USER:agentic_sheets}
    password: ${POSTGRES_PASSWORD:}
  ai:
    mcp:
      client:
        enabled: true
        name: agentic-sheets-backend
        version: 1.0.0
        request-timeout: 30s
        type: SYNC
        streamable-http:
          connections:
            sheets-reader:
              # Base URL only -- endpoint below supplies the /mcp path,
              # matching sheets-reader-mcp's own server.streamable-http
              # config.
              url: ${SHEETS_READER_MCP_URL:http://sheets-mcp:8080}
              endpoint: /mcp
    openai:
      # Blank by default rather than a fake placeholder -- if this is
      # actually blank at runtime (not during `mvn test`, where
      # AgenticSheetsApplicationTests overrides it), the mapping agent's
      # first real call fails with a clear "invalid API key" error, not a
      # silent no-op.
      api-key: ${OPENAI_API_KEY:}
      # Model intentionally not set here at all -- the starter's own
      # maintained default applies. An empty-string override would be
      # worse than no override (passes "" as the model to the API), and
      # a hardcoded model string here would just go stale over time.
      # Override via the standard Spring relaxed-binding env var if a
      # specific model is ever needed: SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL.

agentic-sheets:
  canonical-models-dir: ${AGENTIC_SHEETS_CANONICAL_MODELS_DIR:/config/canonical-models}
  client-configs-dir: ${AGENTIC_SHEETS_CLIENT_CONFIGS_DIR:/config/client-configs}
  canonical:
    reload-interval-ms: ${AGENTIC_SHEETS_CANONICAL_RELOAD_MS:300000}
  # Step 6: read-only access to the same directory sheets-mcp treats as
  # its workspace, so the mapping trigger can hash a source file's actual
  # bytes for import_batch dedupe -- see FileHasher.
  workspace-root: ${AGENTIC_SHEETS_WORKSPACE_ROOT:/workspace}

management:
  endpoints:
    web:
      exposure:
        include: health
  # DataSourceHealthContributorAutoConfiguration picks this up automatically
  # once a DataSource bean exists -- /actuator/health now also reports "db".

logging:
  level:
    com.alai.agenticsheets: INFO
